[project]
name = "ptouch-mcp"
version = "0.1.0"
description = "HTTP and MCP server for printing labels on Brother P-touch tape printers"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pillow>=10.4",
    "mcp>=2.0",
    "pyusb>=1.2",
    # PT-P710BT support is on main but not in the 1.1.0 release (Feb 2026), so this
    # is pinned to a commit. Move to a PyPI version once one ships with PTP710BT.
    "ptouch @ git+https://github.com/nbuchwitz/ptouch@67a5bd4313efd468a9a383d9c4e88d5130e2d716",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
ptouch-mcp = "ptouch_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
